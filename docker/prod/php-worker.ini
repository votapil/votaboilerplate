; Production PHP settings for the CLI image (queue worker, scheduler).
; Smaller opcache than the web image — one long-lived process, one code path.
[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.jit=1255
opcache.jit_buffer_size=64M
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1

[php]
memory_limit=256M
; Jobs may legitimately run for minutes; the queue worker's own --timeout is the
; real bound, this only stops a runaway process.
max_execution_time=300
display_errors=Off
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT
date.timezone=UTC
