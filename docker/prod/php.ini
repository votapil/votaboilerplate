; Production PHP settings for the web/Octane image.
[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.jit=1255
opcache.jit_buffer_size=128M
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
; The code never changes inside a built image, so stop stat-ing every file.
opcache.validate_timestamps=0
; Attributes are read from doc comments at runtime — stripping them breaks them.
opcache.save_comments=1
; No opcache.preload: FrankenPHP/Octane does the worker bootstrap itself.

[php]
memory_limit=256M
upload_max_filesize=20M
post_max_size=25M
max_execution_time=60
display_errors=Off
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT
date.timezone=UTC
